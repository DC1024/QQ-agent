<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用日志</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css"></head>
<body data-panel="logs"><main>
  <header class="head"><div><h2>应用日志</h2><p id="status" class="muted" role="status" aria-live="polite">显示最近 200 条应用日志，连接后实时更新。</p></div><div class="actions">
    <label for="log-level">日志级别</label><select id="log-level"><option value="debug">debug</option><option value="info" selected>info</option><option value="warn">warn</option><option value="error">error</option></select><button type="button" id="reload">刷新</button>
  </div></header>
  <section class="card" aria-label="应用日志内容"><pre id="app-log" class="pre" tabindex="0" aria-label="最近的应用日志">正在读取日志…</pre></section>
</main><script type="module" src="panel.js"></script></body></html>
